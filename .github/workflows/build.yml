name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Find project folder
        id: find
        run: |
          F=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in repo:"
            find . -not -path "./.git/*" | head -60
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> $GITHUB_OUTPUT

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TabletLink-apk
          path: "**/build/outputs/apk/debug/*.apk"
