name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          if [ -f tablet-link.zip ]; then
            unzip -q tablet-link.zip -d project
          else
            mkdir project
            cp -r . project 2>/dev/null || true
          fi
          find project -maxdepth 2 | head -30

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TabletLink-apk
          path: project/app/build/outputs/apk/debug/*.apk
